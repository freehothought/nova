<style>
  :root{--bg:var(--tg-theme-secondary-bg-color,#17212b);--fg:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#8a98a5);--card:var(--tg-theme-bg-color,#1e2a36);--accent:#3390ec;--ok:#4dcb6d;--line:#2a3744;--tile:#26333F;--brand1:#8b5cf6;--brand2:#ec4899}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh}
  h1{font-size:21px;margin:6px 0 2px;text-align:center}
  .sub{color:var(--hint);font-size:13px;text-align:center;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .label{font-size:14px;font-weight:600;margin-bottom:10px}
  .check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.4}
  .check input{margin-top:2px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
  .emojis{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .emoji{font-size:30px;background:var(--tile);border:2px solid transparent;border-radius:12px;
    width:54px;height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .emoji.sel{border-color:var(--accent);background:#21405e}
  .emoji.bad{border-color:#e25555;animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{padding:9px 13px;border-radius:20px;background:var(--tile);border:1px solid var(--line);font-size:13px;cursor:pointer;transition:.12s}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=text],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--fg);font-size:14px;margin-top:4px}
  select{appearance:none;-webkit-appearance:none}
  input[type=text]::placeholder{color:var(--hint)}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:18px;transition:.15s}
  .btn:disabled{background:#33414e;color:#73818e;cursor:not-allowed}
  .skip{display:block;text-align:center;color:var(--hint);font-size:13px;margin-top:12px;cursor:pointer;text-decoration:underline}
  .hidden{display:none}
  .progress{height:5px;background:var(--tile);border-radius:5px;margin:10px 0 16px;overflow:hidden}
  .pbar{height:100%;background:var(--accent);width:33%;transition:width .3s}
  .slide{animation:slidein .28s ease}
  @keyframes slidein{from{transform:translateX(46px);opacity:0}to{transform:translateX(0);opacity:1}}
  .ok-screen{text-align:center;padding-top:60px}
  .ok-screen .big{font-size:64px}
  html[dir=rtl] .check{flex-direction:row}

  /* — Nova brand + Telegram theme layer — */
  @supports (color:color-mix(in srgb,red 50%,blue)){
    :root{--line:color-mix(in srgb,var(--fg) 14%,transparent);--tile:color-mix(in srgb,var(--fg) 7%,var(--card))}
    .btn:disabled{background:color-mix(in srgb,var(--fg) 10%,var(--card));color:var(--hint)}
  }
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(620px 320px at 88% -60px,rgba(139,92,246,.18),transparent 62%),
               radial-gradient(520px 280px at -70px 34%,rgba(236,72,153,.12),transparent 60%)}
  .brand{text-align:center;font-weight:800;letter-spacing:.22em;font-size:13px;margin:2px 0 0;text-transform:uppercase;
    background:linear-gradient(135deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent}
  .gtitle{text-align:center;color:var(--hint);font-size:12px;margin:2px 0 10px}
  .gtitle:empty{display:none}
  .btn:not(:disabled){background:linear-gradient(135deg,var(--brand1),var(--brand2))}
  .pbar{background:linear-gradient(90deg,var(--brand1),var(--brand2))}
  .chip.sel{background:linear-gradient(135deg,var(--brand1),var(--brand2));border-color:transparent;color:#fff}
  .emoji.sel{border-color:var(--brand2)}
  @supports (((-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px))) and (color:color-mix(in srgb,red 50%,blue))){
    .card{background:color-mix(in srgb,var(--card) 78%,transparent);
      backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15)}
  }
  @keyframes pop{0%{transform:scale(.35);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1)}}
  .ok-screen .big{animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
</style>
</head>

      <button class="btn" id="submit"></button>
    </div>
    <span class="skip" id="skip"></span>
  </div>

  <div id="done" class="ok-screen hidden">
    <div class="big">✅</div>
    <h1 id="t_done"></h1>
    <div class="sub" id="t_done_sub"></div>
    <div class="card" id="done_cta" style="margin-top:18px;text-align:start;line-height:1.5"></div>
    <button class="btn" id="closeBtn"></button>

</div>

sername":"❌ Qo‘shilish so‘rovingizni tasdiqlab bo‘lmadi: ushbu guruh uchun Telegram foydalanuvchi nomi (@username) bo‘lishi kerak.\n\nSiz Sozlamalar → Foydalanuvchi nomi orqali foydalanuvchi nomini qo‘shishingiz va so‘rovni qayta yuborishingiz mumkin. 👇","bio_filter":"❌ Qo‘shilish haqidagi so‘rovingizni ma’qullab bo‘lmadi: bu guruh sizning so‘rovingizni avtomatik ravishda rad etdi, chunki profilingizdagi havola yoki @teg mavjud.\n\nBiologiyangizni tozalagandan so'ng yana so'rov yuborishingiz mumkin. 👇"},"vi":{"no_username":"❌ Yêu cầu tham gia của bạn không thể được chấp thuận: bạn phải có tên người dùng Telegram (@username) cho nhóm này.\n\nBạn có thể thêm tên người dùng và gửi lại yêu cầu trong Cài đặt → Tên người dùng. 👇","bio_filter":"❌ Yêu cầu tham gia của bạn không thể được chấp thuận: nhóm này tự động từ chối yêu cầu của bạn vì có liên kết hoặc @tag trong tiểu sử hồ sơ của bạn.\n\nBạn có thể gửi lại yêu cầu sau khi xóa tiểu sử của mình. 👇"},"zh":{"no_username":"❌ 您的加入请求无法获得批准：您必须拥有该群组的 Telegram 用户名 (@username)。\n\n您可以在“设置”→“用户名”中添加用户名并再次发送请求。 👇","bio_filter":"❌ 您的加入请求无法获得批准：该群组自动拒绝您的请求，因为您的个人资料简介中存在链接或@标签。\n\n您可以在清除个人简介后再次发送请求。 👇"}};
(function(){
  const RJ=new URLSearchParams(location.search).get("reject");
  if(!RJ) return;
  const M=REJECT_TEXTS[LANG]||REJECT_TEXTS["en"]||{};
  let msg=M[RJ]||(REJECT_TEXTS["en"]||{})[RJ]||"";
  if(!msg) return;
  msg=msg.replace(/^❌\s*/,"");
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.add("hidden");
  const d=document.getElementById("done"); d.classList.remove("hidden");
  const big=d.querySelector(".big"); if(big) big.textContent="❌";
  const t=document.getElementById("t_done"); if(t) t.textContent="";
  const s=document.getElementById("t_done_sub"); if(s) s.textContent="";
  const c=document.getElementById("done_cta");
  if(c){ c.style.whiteSpace="pre-line"; c.textContent=msg; }
  const b=document.getElementById("closeBtn"); if(b){ b.textContent="OK"; }
})();

document.getElementById("age1").placeholder = X.ageph;
document.getElementById("age2").placeholder = X.ageph;

// Country + city pickers from Nova's own data (cities.json). Sent as country code +
// city name; the bot resolves (country_code, name) -> Nova cities.id.
const COUNTRY_LABELS={tr:"🇹🇷 Türkiye",en:"🇺🇸 USA / UK",de:"🇩🇪 Deutschland",az:"🇦🇿 Azərbaycan",ru:"🇷🇺 Russia",ua:"🇺🇦 Ukraine",fr:"🇫🇷 France",es:"🇪🇸 España",it:"🇮🇹 Italia",pt:"🇵🇹 Portugal",nl:"🇳🇱 Nederland",pl:"🇵🇱 Polska",el:"🇬🇷 Greece",bg:"🇧🇬 Bulgaria",ro:"🇷🇴 România",ca:"🇪🇸 Català",cs:"🇨🇿 Czechia",sr:"🇷🇸 Serbia",da:"🇩🇰 Danmark",ar:"🇦🇪 Arab World",fa:"🇮🇷 Iran",he:"🇮🇱 Israel",hr:"🇭🇷 Hrvatska",id:"🇮🇩 Indonesia",ja:"🇯🇵 Japan",zh:"🇨🇳 China"};
const LANG2COUNTRY={uk:"ua"}; // Telegram lang code -> Nova country code mismatch
let CITYDATA={};
const countrySel=document.getElementById("country"), citySel=document.getElementById("city");
function fillCities(cc){
  citySel.innerHTML="";
  const def=document.createElement("option"); def.value=""; def.textContent=T.city; citySel.appendChild(def);
  (CITYDATA[cc]||[]).forEach(name=>{ const o=document.createElement("option"); o.value=name; o.textContent=name; citySel.appendChild(o); });
}
function initCountries(){
  const codes=Object.keys(CITYDATA);
  const ordered=Object.keys(COUNTRY_LABELS).filter(c=>codes.includes(c)).concat(codes.filter(c=>!(c in COUNTRY_LABELS)));
  countrySel.innerHTML="";
  ordered.forEach(cc=>{ const o=document.createElement("option"); o.value=cc; o.textContent=COUNTRY_LABELS[cc]||cc.toUpperCase(); countrySel.appendChild(o); });
  let def=LANG2COUNTRY[LANG]||LANG;
  if(!CITYDATA[def]) def = CITYDATA["tr"]?"tr":(ordered[0]||"");
  countrySel.value=def; fillCities(def);
}
countrySel.onchange=()=>fillCities(countrySel.value);
fetch("cities.json").then(r=>r.json()).then(d=>{ CITYDATA=d; initCountries(); }).catch(()=>{});

// captcha
const POOL=["🍎","⭐","🚗","🐶","🌸","⚽","🔑","🎈","🍕","🌙"];
let target;
function buildCaptcha(){
  const sh=[...POOL].sort(()=>Math.random()-0.5).slice(0,5);
  target=sh[Math.floor(Math.random()*sh.length)];
  document.getElementById("cap_target").textContent=target;
  const box=document.getElementById("emojis"); box.innerHTML="";
  sh.forEach(em=>{
    const d=document.createElement("div"); d.className="emoji"; d.textContent=em;
    d.onclick=()=>{
      if(em===target){ document.querySelectorAll(".emoji").forEach(x=>x.classList.remove("sel","bad")); d.classList.add("sel"); window._cap=true; hap("success"); refresh(); }
      else{ d.classList.add("bad"); window._cap=false; hap("error"); setTimeout(()=>d.classList.remove("bad"),300); setTimeout(buildCaptcha,350); refresh(); }
    };
    box.appendChild(d);
  });
}
buildCaptcha();

const age=document.getElementById("age"), rules=document.getElementById("rules"), inact=document.getElementById("inact"), next=document.getElementById("next");
function refresh(){ next.disabled = !(age.checked && rules.checked && inact.checked && window._cap===true); }
age.onchange=refresh; rules.onchange=refresh; inact.onchange=refresh;
// Onboarding as a one-question-at-a-time swipe deck.
const SLIDES=["q_acc","q_age","q_city"];
function showSlide(name){
  SLIDES.forEach(s=>{ document.getElementById(s).classList.toggle("hidden", s!==name); });
  const idx=SLIDES.indexOf(name);
  document.getElementById("pbar").style.width=((idx+1)/SLIDES.length*100)+"%";
}
const KNOWN=new URLSearchParams(location.search).get("known")==="1";
next.onclick=()=>{
  document.getElementById("step1").classList.add("hidden");
  if(KNOWN){ finish(true); return; }  // returning/known member -> skip questions
  document.getElementById("step2").classList.remove("hidden"); buildChips(); showSlide("q_acc");
};

// Account usage = Nova role_code (woman/man/couple). Couple => two age fields.
const ROLE_CODES=["woman","man","couple"];
let roleSel=null;
function buildChips(){
  const c=document.getElementById("g_acc"); c.innerHTML="";
  T.genders.slice(0,3).forEach((it,i)=>{
    const d=document.createElement("div"); d.className="chip"; d.textContent=it;
    d.onclick=()=>{
      hap("sel"); [...c.children].forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); roleSel=i;
      const couple=(i===2);
      document.getElementById("card_age2").classList.toggle("hidden", !couple);
      set("t_age1", couple ? X.p1 : X.age);
      setTimeout(()=>showSlide("q_age"), 220);
    };
    c.appendChild(d);
  });
}
document.getElementById("ageNext").onclick=()=>showSlide("q_city");
function ageVal(id){ const v=parseInt((document.getElementById(id).value||"").trim(),10); return (v>=18 && v<=99)? v : null; }

// The bridge address used to be a single host, and because sslip.io encodes the
// server's IP in the name, moving the bot to another machine silently broke
// verification for everyone. Both hosts are tried at once now: whichever answers
// first wins, so a migration needs no change here and a rollback needs none either.
// Answering a guard query twice is not a hazard — the second attempt is refused
// by Telegram, and only a response carrying ok:true is accepted below.
const GUARD_BRIDGES=[
  "https://62-238-111-0.sslip.io:8443/guard/complete",   // Hetzner (mira-prod)
  "https://13-61-190-174.sslip.io:8443/guard/complete"   // AWS (eski)
];
function finish(skip){
  hap("success");
  const Q=new URLSearchParams(location.search);
  const g=Q.get("g");
  const couple=(roleSel===2);
  const payload={ v:1, ok:true, age_ok:true, rules_ok:true, captcha:true, inactivity_ok:true, lang:LANG,
    g: g?parseInt(g,10):null,
    role: (skip||roleSel===null)?null:ROLE_CODES[roleSel],
    age: skip?null:ageVal("age1"),
    age2: (skip||!couple)?null:ageVal("age2"),
    country: skip?null:(document.getElementById("country").value||null),
    city: skip?null:(document.getElementById("city").value.trim()||null),
    guard: Q.get("guard")==="1"?1:0, query: Q.get("query")||null, ts:Date.now() };
  const isGuard = payload.guard===1 && payload.query;
  if(isGuard){
    // Guard (in-group) mini-app: sendData does not reach a polling bot. Preferred return
    // path is the HTTPS bridge; if it is down/unreachable, fall back to a t.me deep link
    // (/start gq_...) which the bot receives via normal polling and approves.
    const showDone=()=>{ document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("done").classList.remove("hidden"); };
    const deepLink=()=>{
      let param="gq_"+payload.query;
      try{
        const compact=[payload.role||"",payload.age||"",payload.age2||"",payload.country||"",payload.city||"",LANG||""].join("|");
        let bytes=new TextEncoder().encode(compact);
        const budget=Math.floor((64-param.length-1)/4)*3; // start payload max 64 chars
        if(bytes.length>budget) bytes=bytes.slice(0,Math.max(0,budget));
        if(bytes.length>0){
          let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
          const b64=btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
          if(param.length+1+b64.length<=64) param+="_"+b64;
        }
      }catch(e){}
      showDone();
      // Two Nova bots share this page during the handover; the deep link must reach the
      // bot that opened the query (only it can answer it). The opener passes ?bot=; an
      // allow-list keeps this from becoming an open redirect, and no param keeps the
      // old target.
      const botParam=Q.get("bot")||"";
      const BOT=/^Nova(Profile|Profil)Bot$/.test(botParam)?botParam:"NovaProfileBot";
      try{ tg.openTelegramLink("https://t.me/"+BOT+"?start="+param); }catch(e){}
      setTimeout(()=>{ try{ tg.close(); }catch(e){} }, 600);
    };
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), 5000);
    const body=JSON.stringify({initData:tg.initData||"", query:payload.query, g:payload.g, payload:payload});
    // Deliberately parallel, not sequential: trying one host and waiting for it to
    // time out before trying the next would add five seconds to every verification
    // while only one machine is live. Fired together, the dead host just fails.
    let settled=false;
    const done=()=>{ if(settled) return; settled=true; clearTimeout(timer); try{ctrl.abort();}catch(e){}
      showDone(); setTimeout(()=>{ try{ tg.close(); }catch(e){} }, 1200); };
    let pending=GUARD_BRIDGES.length;
    const missed=()=>{ if(settled) return; if(--pending<=0){ clearTimeout(timer); deepLink(); } };
    GUARD_BRIDGES.forEach(url=>{
      fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:body,signal:ctrl.signal})
        .then(r=>r.json())
        .then(res=>{ if(res&&res.ok) done(); else missed(); })
        .catch(()=>missed());
    });
    return;
  }
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("done").classList.remove("hidden");
  try{ tg.sendData(JSON.stringify(payload)); }catch(e){}
}
document.getElementById("submit").onclick=()=>finish(false);
document.getElementById("skip").onclick=()=>finish(true);
document.getElementById("closeBtn").onclick=()=>{ try{ tg.close(); }catch(e){} };
</script>
